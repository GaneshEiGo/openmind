<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 170" width="1200" height="170" role="img" aria-label="OpenMind footer: dashed rehearsal resolves to a solid commit"><title>OpenMind footer: dashed rehearsal resolves to a solid commit</title><defs><style>.s{font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}@media (prefers-reduced-motion:reduce){*{animation:none}}</style></defs><rect width="1200" height="170" rx="18" fill="#0B0D12"/><line x1="80" y1="44" x2="600" y2="44" stroke="#8FB4E8" stroke-width="2" stroke-dasharray="7 6"/><line x1="600" y1="44" x2="1120" y2="44" stroke="#3B6CFF" stroke-width="2"/><circle cx="600" cy="44" r="6" fill="#2FBF9B"/><text x="600" y="92" class="s" font-size="18" font-weight="500" fill="#ECEFF6" text-anchor="middle" >Understand → Compose → Rehearse → Approve → Commit → Verify → Remember</text><text x="600" y="128" class="s" font-size="14" font-weight="400" fill="#9AA3B8" text-anchor="middle" font-style="italic">Ambitious in what it imagines, disciplined in what it builds, unusually honest about what it can do.</text></svg>