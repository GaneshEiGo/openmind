<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 400" width="1100" height="400" role="img" aria-label="Fidelity ladder F3 full rehearsal down to F0 unsupported"><title>Fidelity ladder F3 full rehearsal down to F0 unsupported</title><defs><style>.s{font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}</style></defs><rect width="1100" height="400" rx="18" fill="#0B0D12"/><text x="40" y="46" class="s" font-size="20" font-weight="600" fill="#ECEFF6" text-anchor="start" >How faithfully can the Mirror reproduce reality?</text><rect x="40" y="74" width="520" height="52" rx="12" fill="#2FBF9B" fill-opacity=".18" stroke="#2FBF9B" stroke-width="1.5"/><text x="62" y="108" class="s" font-size="24" font-weight="600" fill="#2FBF9B" text-anchor="start" >F3</text><text x="112" y="106" class="s" font-size="15" font-weight="600" fill="#ECEFF6" text-anchor="start" >Full rehearsal</text><text x="582" y="96" class="s" font-size="14" font-weight="500" fill="#ECEFF6" text-anchor="start" >Local filesystem, local documents</text><text x="582" y="116" class="s" font-size="13" font-weight="400" fill="#9AA3B8" text-anchor="start" >Rehearse, diff, commit, verify</text><rect x="40" y="140" width="420" height="52" rx="12" fill="#1E9E7E" fill-opacity=".18" stroke="#1E9E7E" stroke-width="1.5"/><text x="62" y="174" class="s" font-size="24" font-weight="600" fill="#1E9E7E" text-anchor="start" >F2</text><text x="112" y="172" class="s" font-size="15" font-weight="600" fill="#ECEFF6" text-anchor="start" >Partial rehearsal</text><text x="482" y="162" class="s" font-size="14" font-weight="500" fill="#ECEFF6" text-anchor="start" >Cloud sheets, calendars, mail drafts</text><text x="482" y="182" class="s" font-size="13" font-weight="400" fill="#9AA3B8" text-anchor="start" >Shows what was and was not simulated</text><rect x="40" y="206" width="320" height="52" rx="12" fill="#F0A63A" fill-opacity=".18" stroke="#F0A63A" stroke-width="1.5"/><text x="62" y="240" class="s" font-size="24" font-weight="600" fill="#F0A63A" text-anchor="start" >F1</text><text x="112" y="238" class="s" font-size="15" font-weight="600" fill="#ECEFF6" text-anchor="start" >Plan only</text><text x="382" y="228" class="s" font-size="14" font-weight="500" fill="#ECEFF6" text-anchor="start" >Native apps through accessibility</text><text x="382" y="248" class="s" font-size="13" font-weight="400" fill="#9AA3B8" text-anchor="start" >Labelled as a plan; guarded execution</text><rect x="40" y="272" width="220" height="52" rx="12" fill="#E5484D" fill-opacity=".18" stroke="#E5484D" stroke-width="1.5"/><text x="62" y="306" class="s" font-size="24" font-weight="600" fill="#E5484D" text-anchor="start" >F0</text><text x="112" y="304" class="s" font-size="15" font-weight="600" fill="#ECEFF6" text-anchor="start" >Unsupported</text><text x="282" y="294" class="s" font-size="14" font-weight="500" fill="#ECEFF6" text-anchor="start" >Opaque or protected apps</text><text x="282" y="314" class="s" font-size="13" font-weight="400" fill="#9AA3B8" text-anchor="start" >No preview claimed; approve every consequential step</text><text x="40" y="366" class="s" font-size="15" font-weight="400" fill="#9AA3B8" text-anchor="start" >A rehearsal is evidence, not proof. OpenMind says what it could not simulate and never fakes a rehearsal.</text></svg>