<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 510" width="1200" height="510" role="img" aria-label="Reversibility taxonomy R0 to R4. R3 and R4 never auto-commit."><title>Reversibility taxonomy R0 to R4. R3 and R4 never auto-commit.</title><defs><style>.s{font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}</style></defs><rect width="1200" height="510" rx="18" fill="#0B0D12"/><text x="40" y="52" class="s" font-size="20" font-weight="600" fill="#ECEFF6" text-anchor="start" >A high confidence score never lowers an action's class.</text><text x="40" y="78" class="s" font-size="14" font-weight="400" fill="#9AA3B8" text-anchor="start" >Every action carries exactly one class. This is the rule that carries the safety philosophy.</text><rect x="40" y="350" width="212" height="130" rx="12" fill="#9AA3B8" fill-opacity=".16" stroke="#9AA3B8" stroke-width="1.5"/><text x="60" y="392" class="s" font-size="32" font-weight="600" fill="#9AA3B8" text-anchor="start" >R0</text><text x="60" y="418" class="s" font-size="15" font-weight="600" fill="#ECEFF6" text-anchor="start" >Read-only</text><text x="60" y="444" class="s" font-size="13" font-weight="400" fill="#9AA3B8" text-anchor="start" >search files</text><text x="60" y="462" class="s" font-size="13" font-weight="400" fill="#9AA3B8" text-anchor="start" >read a calendar</text><rect x="40" y="316" width="212" height="26" rx="13" fill="none" stroke="#9AA3B8" stroke-width="1.2"/><text x="146" y="334" class="s" font-size="12" font-weight="500" fill="#9AA3B8" text-anchor="middle" >auto-commit: yes</text><rect x="268" y="310" width="212" height="170" rx="12" fill="#2FBF9B" fill-opacity=".16" stroke="#2FBF9B" stroke-width="1.5"/><text x="288" y="352" class="s" font-size="32" font-weight="600" fill="#2FBF9B" text-anchor="start" >R1</text><text x="288" y="378" class="s" font-size="15" font-weight="600" fill="#ECEFF6" text-anchor="start" >Reversible local</text><text x="288" y="404" class="s" font-size="13" font-weight="400" fill="#9AA3B8" text-anchor="start" >move or rename a file</text><text x="288" y="422" class="s" font-size="13" font-weight="400" fill="#9AA3B8" text-anchor="start" >create a draft</text><rect x="268" y="276" width="212" height="26" rx="13" fill="none" stroke="#2FBF9B" stroke-width="1.2"/><text x="374" y="294" class="s" font-size="12" font-weight="500" fill="#2FBF9B" text-anchor="middle" >auto-commit: once earned</text><rect x="496" y="270" width="212" height="210" rx="12" fill="#1E9E7E" fill-opacity=".16" stroke="#1E9E7E" stroke-width="1.5"/><text x="516" y="312" class="s" font-size="32" font-weight="600" fill="#1E9E7E" text-anchor="start" >R2</text><text x="516" y="338" class="s" font-size="15" font-weight="600" fill="#ECEFF6" text-anchor="start" >Recoverable</text><text x="516" y="364" class="s" font-size="13" font-weight="400" fill="#9AA3B8" text-anchor="start" >edit a document</text><text x="516" y="382" class="s" font-size="13" font-weight="400" fill="#9AA3B8" text-anchor="start" >update sheet cells</text><rect x="496" y="236" width="212" height="26" rx="13" fill="none" stroke="#2FBF9B" stroke-width="1.2"/><text x="602" y="254" class="s" font-size="12" font-weight="500" fill="#2FBF9B" text-anchor="middle" >auto-commit: earned, scoped</text><rect x="724" y="230" width="212" height="250" rx="12" fill="#F0A63A" fill-opacity=".16" stroke="#F0A63A" stroke-width="1.5"/><text x="744" y="272" class="s" font-size="32" font-weight="600" fill="#F0A63A" text-anchor="start" >R3</text><text x="744" y="298" class="s" font-size="15" font-weight="600" fill="#ECEFF6" text-anchor="start" >External</text><text x="744" y="324" class="s" font-size="13" font-weight="400" fill="#9AA3B8" text-anchor="start" >send an email</text><text x="744" y="342" class="s" font-size="13" font-weight="400" fill="#9AA3B8" text-anchor="start" >share, publish, post</text><rect x="724" y="196" width="212" height="26" rx="13" fill="none" stroke="#F0A63A" stroke-width="1.2"/><text x="830" y="214" class="s" font-size="12" font-weight="500" fill="#F0A63A" text-anchor="middle" >auto-commit: never</text><rect x="952" y="190" width="212" height="290" rx="12" fill="#E5484D" fill-opacity=".16" stroke="#E5484D" stroke-width="1.5"/><text x="972" y="232" class="s" font-size="32" font-weight="600" fill="#E5484D" text-anchor="start" >R4</text><text x="972" y="258" class="s" font-size="15" font-weight="600" fill="#ECEFF6" text-anchor="start" >Critical</text><text x="972" y="284" class="s" font-size="13" font-weight="400" fill="#9AA3B8" text-anchor="start" >payments, purchases</text><text x="972" y="302" class="s" font-size="13" font-weight="400" fill="#9AA3B8" text-anchor="start" >permanent deletion</text><rect x="952" y="156" width="212" height="26" rx="13" fill="none" stroke="#E5484D" stroke-width="1.2"/><text x="1058" y="174" class="s" font-size="12" font-weight="500" fill="#E5484D" text-anchor="middle" >auto-commit: never</text><line x1="716" y1="104" x2="716" y2="480" stroke="#F0A63A" stroke-width="1.5" stroke-dasharray="6 6"/><text x="704" y="110" class="s" font-size="13" font-weight="500" fill="#2FBF9B" text-anchor="end" >auto-commit can be earned</text><text x="728" y="110" class="s" font-size="13" font-weight="500" fill="#F0A63A" text-anchor="start" >a human decides, every time</text></svg>