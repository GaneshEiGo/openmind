<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 250" width="1100" height="250" role="img" aria-label="Ambient Halo states from idle to paused"><title>Ambient Halo states from idle to paused</title><defs><style>.s{font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}.spin{transform-box:fill-box;transform-origin:center;animation:spin 6s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.shim{animation:shim 3s linear infinite}@keyframes shim{to{stroke-dashoffset:-30}}.pulse{animation:pulse 2.6s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}.bar{transform-box:fill-box;transform-origin:center;animation:bar 1.1s ease-in-out infinite}@keyframes bar{0%,100%{transform:scaleY(.4)}50%{transform:scaleY(1)}}.b2{animation-delay:.15s}.b3{animation-delay:.3s}.b4{animation-delay:.45s}.b5{animation-delay:.6s}@media (prefers-reduced-motion:reduce){.spin,.shim,.pulse,.bar{animation:none}}</style></defs><rect width="1100" height="250" rx="18" fill="#0B0D12"/><circle cx="61.111111111111114" cy="84" r="28" fill="none" stroke="#9AA3B8" stroke-opacity=".35" stroke-width="2"/><text x="61.111111111111114" y="144" class="s" font-size="14" font-weight="600" fill="#ECEFF6" text-anchor="middle" >Idle</text><text x="61.111111111111114" y="164" class="s" font-size="11" font-weight="400" fill="#9AA3B8" text-anchor="middle" >nearly static</text><circle cx="183.33333333333334" cy="84" r="28" fill="none" stroke="#3B6CFF" stroke-width="2"/><rect class="bar b1" x="165.33333333333334" y="72" width="4" height="24" rx="2" fill="#3B6CFF"/><rect class="bar b2" x="173.33333333333334" y="72" width="4" height="24" rx="2" fill="#3B6CFF"/><rect class="bar b3" x="181.33333333333334" y="72" width="4" height="24" rx="2" fill="#3B6CFF"/><rect class="bar b4" x="189.33333333333334" y="72" width="4" height="24" rx="2" fill="#3B6CFF"/><rect class="bar b5" x="197.33333333333334" y="72" width="4" height="24" rx="2" fill="#3B6CFF"/><circle cx="209.33333333333334" cy="58" r="5" fill="#E5484D"/><text x="183.33333333333334" y="144" class="s" font-size="14" font-weight="600" fill="#ECEFF6" text-anchor="middle" >Listening</text><text x="183.33333333333334" y="164" class="s" font-size="11" font-weight="400" fill="#9AA3B8" text-anchor="middle" >waveform + mic dot</text><circle cx="305.55555555555554" cy="84" r="28" fill="none" stroke="#8B7BFF" stroke-opacity=".25" stroke-width="2"/><g class="spin"><path d="M305.55555555555554 56 A28 28 0 0 1 333.55555555555554 84" fill="none" stroke="#8B7BFF" stroke-width="3" stroke-linecap="round"/></g><text x="305.55555555555554" y="144" class="s" font-size="14" font-weight="600" fill="#ECEFF6" text-anchor="middle" >Thinking</text><text x="305.55555555555554" y="164" class="s" font-size="11" font-weight="400" fill="#9AA3B8" text-anchor="middle" >slow light drift</text><circle cx="427.7777777777778" cy="84" r="28" fill="#8FB4E8" fill-opacity=".12" stroke="#8FB4E8" stroke-width="2" stroke-dasharray="6 6" class="shim"/><text x="427.7777777777778" y="144" class="s" font-size="14" font-weight="600" fill="#ECEFF6" text-anchor="middle" >Rehearsing</text><text x="427.7777777777778" y="164" class="s" font-size="11" font-weight="400" fill="#9AA3B8" text-anchor="middle" >silver, dashed</text><circle class="pulse" cx="550.0" cy="84" r="28" fill="none" stroke="#F0A63A" stroke-width="3"/><rect x="548.5" y="72" width="3" height="16" rx="1.5" fill="#F0A63A"/><circle cx="550.0" cy="96" r="2" fill="#F0A63A"/><text x="550.0" y="144" class="s" font-size="14" font-weight="600" fill="#ECEFF6" text-anchor="middle" >Needs approval</text><text x="550.0" y="164" class="s" font-size="11" font-weight="400" fill="#9AA3B8" text-anchor="middle" >slow amber pulse</text><circle cx="672.2222222222222" cy="84" r="28" fill="none" stroke="#3B6CFF" stroke-width="3"/><text x="672.2222222222222" y="144" class="s" font-size="14" font-weight="600" fill="#ECEFF6" text-anchor="middle" >Executing</text><text x="672.2222222222222" y="164" class="s" font-size="11" font-weight="400" fill="#9AA3B8" text-anchor="middle" >steady blue</text><circle cx="794.4444444444445" cy="84" r="28" fill="#2FBF9B" fill-opacity=".14" stroke="#2FBF9B" stroke-width="2"/><path d="M784.4444444444445 84 l7 8 l13 -16" fill="none" stroke="#2FBF9B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="794.4444444444445" y="144" class="s" font-size="14" font-weight="600" fill="#ECEFF6" text-anchor="middle" >Verified</text><text x="794.4444444444445" y="164" class="s" font-size="11" font-weight="400" fill="#9AA3B8" text-anchor="middle" >brief teal confirm</text><circle cx="916.6666666666667" cy="84" r="28" fill="#E5484D" fill-opacity=".12" stroke="#E5484D" stroke-width="2"/><path d="M907.6666666666667 75 l18 18 M925.6666666666667 75 l-18 18" stroke="#E5484D" stroke-width="3" stroke-linecap="round"/><text x="916.6666666666667" y="144" class="s" font-size="14" font-weight="600" fill="#ECEFF6" text-anchor="middle" >Error</text><text x="916.6666666666667" y="164" class="s" font-size="11" font-weight="400" fill="#9AA3B8" text-anchor="middle" >calm red + message</text><circle cx="1038.888888888889" cy="84" r="28" fill="none" stroke="#9AA3B8" stroke-width="2"/><rect x="1030.888888888889" y="74" width="5" height="20" rx="2" fill="#9AA3B8"/><rect x="1041.888888888889" y="74" width="5" height="20" rx="2" fill="#9AA3B8"/><text x="1038.888888888889" y="144" class="s" font-size="14" font-weight="600" fill="#ECEFF6" text-anchor="middle" >Paused</text><text x="1038.888888888889" y="164" class="s" font-size="11" font-weight="400" fill="#9AA3B8" text-anchor="middle" >hollow grey ring</text><text x="550" y="214" class="s" font-size="13" font-weight="400" fill="#9AA3B8" text-anchor="middle" >The Halo never implies the microphone, camera or screen is in use when it is not. Sensors have their own honest indicator.</text></svg>