<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" width="1200" height="430" role="img" aria-label="The four layers of OpenMind: Mind, Nexus, Pilot and Mirror"><title>The four layers of OpenMind: Mind, Nexus, Pilot and Mirror</title><defs><style>.s{font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}</style></defs><rect width="1200" height="430" rx="18" fill="#0B0D12"/><rect x="30" y="40" width="270" height="290" rx="16" fill="#12151C" stroke="#8B7BFF" stroke-width="1.5" /><text x="54" y="88" class="s" font-size="32" font-weight="600" fill="#8B7BFF" text-anchor="start" >Mind</text><text x="54" y="114" class="s" font-size="15" font-weight="400" fill="#9AA3B8" text-anchor="start" >understands</text><line x1="54" y1="132" x2="276" y2="132" stroke="#272C3A"/><text x="54" y="162" class="s" font-size="15" font-weight="400" fill="#ECEFF6" text-anchor="start" font-style="italic">What is going on, and what</text><text x="54" y="184" class="s" font-size="15" font-weight="400" fill="#ECEFF6" text-anchor="start" font-style="italic">do you actually need?</text><circle cx="59" cy="216" r="3" fill="#8B7BFF"/><text x="72" y="221" class="s" font-size="14" font-weight="400" fill="#9AA3B8" text-anchor="start" >Ambient Cognition</text><circle cx="59" cy="242" r="3" fill="#8B7BFF"/><text x="72" y="247" class="s" font-size="14" font-weight="400" fill="#9AA3B8" text-anchor="start" >World Model and Mindweave</text><circle cx="59" cy="268" r="3" fill="#8B7BFF"/><text x="72" y="273" class="s" font-size="14" font-weight="400" fill="#9AA3B8" text-anchor="start" >Intent Crystallization</text><text x="54" y="312" class="m" font-size="12" font-weight="400" fill="#9AA3B8" text-anchor="start" >the memory  ·  from OpenMind</text><path d="M304 185 h12" stroke="#9AA3B8" stroke-width="1.5"/><path d="M313 181 l5 4 l-5 4" fill="none" stroke="#9AA3B8" stroke-width="1.5"/><rect x="320" y="40" width="270" height="290" rx="16" fill="#12151C" stroke="#ECEFF6" stroke-width="1.5" /><text x="344" y="88" class="s" font-size="32" font-weight="600" fill="#ECEFF6" text-anchor="start" >Nexus</text><text x="344" y="114" class="s" font-size="15" font-weight="400" fill="#9AA3B8" text-anchor="start" >shapes</text><line x1="344" y1="132" x2="566" y2="132" stroke="#272C3A"/><text x="344" y="162" class="s" font-size="15" font-weight="400" fill="#ECEFF6" text-anchor="start" font-style="italic">What is the right interface</text><text x="344" y="184" class="s" font-size="15" font-weight="400" fill="#ECEFF6" text-anchor="start" font-style="italic">for this moment?</text><circle cx="349" cy="216" r="3" fill="#ECEFF6"/><text x="362" y="221" class="s" font-size="14" font-weight="400" fill="#9AA3B8" text-anchor="start" >Liquid UI and Intent Surfaces</text><circle cx="349" cy="242" r="3" fill="#ECEFF6"/><text x="362" y="247" class="s" font-size="14" font-weight="400" fill="#9AA3B8" text-anchor="start" >Generative workspace</text><circle cx="349" cy="268" r="3" fill="#ECEFF6"/><text x="362" y="273" class="s" font-size="14" font-weight="400" fill="#9AA3B8" text-anchor="start" >Intent Lens</text><text x="344" y="312" class="m" font-size="12" font-weight="400" fill="#9AA3B8" text-anchor="start" >the face  ·  from EiNexus</text><path d="M594 185 h12" stroke="#9AA3B8" stroke-width="1.5"/><path d="M603 181 l5 4 l-5 4" fill="none" stroke="#9AA3B8" stroke-width="1.5"/><rect x="610" y="40" width="270" height="290" rx="16" fill="#12151C" stroke="#3B6CFF" stroke-width="1.5" /><text x="634" y="88" class="s" font-size="32" font-weight="600" fill="#3B6CFF" text-anchor="start" >Pilot</text><text x="634" y="114" class="s" font-size="15" font-weight="400" fill="#9AA3B8" text-anchor="start" >acts</text><line x1="634" y1="132" x2="856" y2="132" stroke="#272C3A"/><text x="634" y="162" class="s" font-size="15" font-weight="400" fill="#ECEFF6" text-anchor="start" font-style="italic">Can the computer do it?</text><circle cx="639" cy="216" r="3" fill="#3B6CFF"/><text x="652" y="221" class="s" font-size="14" font-weight="400" fill="#9AA3B8" text-anchor="start" >Agent Mesh</text><circle cx="639" cy="242" r="3" fill="#3B6CFF"/><text x="652" y="247" class="s" font-size="14" font-weight="400" fill="#9AA3B8" text-anchor="start" >Phantom Execution</text><circle cx="639" cy="268" r="3" fill="#3B6CFF"/><text x="652" y="273" class="s" font-size="14" font-weight="400" fill="#9AA3B8" text-anchor="start" >API-first routing</text><text x="634" y="312" class="m" font-size="12" font-weight="400" fill="#9AA3B8" text-anchor="start" >the hands  ·  from EiPilot</text><path d="M884 185 h12" stroke="#9AA3B8" stroke-width="1.5"/><path d="M893 181 l5 4 l-5 4" fill="none" stroke="#9AA3B8" stroke-width="1.5"/><rect x="900" y="40" width="270" height="290" rx="16" fill="#12151C" stroke="#8FB4E8" stroke-width="1.5" stroke-dasharray="7 6"/><text x="924" y="88" class="s" font-size="32" font-weight="600" fill="#8FB4E8" text-anchor="start" >Mirror</text><text x="924" y="114" class="s" font-size="15" font-weight="400" fill="#9AA3B8" text-anchor="start" >proves and reverses</text><line x1="924" y1="132" x2="1146" y2="132" stroke="#272C3A"/><text x="924" y="162" class="s" font-size="15" font-weight="400" fill="#ECEFF6" text-anchor="start" font-style="italic">Should I let it, and can</text><text x="924" y="184" class="s" font-size="15" font-weight="400" fill="#ECEFF6" text-anchor="start" font-style="italic">I take it back?</text><circle cx="929" cy="216" r="3" fill="#8FB4E8"/><text x="942" y="221" class="s" font-size="14" font-weight="400" fill="#9AA3B8" text-anchor="start" >Rehearsal and Reality Diff</text><circle cx="929" cy="242" r="3" fill="#8FB4E8"/><text x="942" y="247" class="s" font-size="14" font-weight="400" fill="#9AA3B8" text-anchor="start" >Transactional commit and undo</text><circle cx="929" cy="268" r="3" fill="#8FB4E8"/><text x="942" y="273" class="s" font-size="14" font-weight="400" fill="#9AA3B8" text-anchor="start" >Trust Ledger</text><text x="924" y="312" class="m" font-size="12" font-weight="400" fill="#9AA3B8" text-anchor="start" >the conscience  ·  from EiMirror</text><text x="600" y="378" class="s" font-size="18" font-weight="500" fill="#ECEFF6" text-anchor="middle" >Pilot is the hands. Mirror is the conscience. Nexus is the face. Mind is the memory.</text><text x="600" y="406" class="s" font-size="14" font-weight="400" fill="#9AA3B8" text-anchor="middle" >One experience. Mirror is not optional plumbing: it is what makes delegation safe enough to use.</text></svg>