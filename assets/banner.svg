<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="OpenMind banner: a rehearsal in dashed silver resolves into solid, verified reality"><title>OpenMind banner: a rehearsal in dashed silver resolves into solid, verified reality</title><defs><radialGradient id="glow" cx="84%" cy="32%" r="70%"><stop offset="0" stop-color="#3B6CFF" stop-opacity=".24"/><stop offset="1" stop-color="#0B0D12" stop-opacity="0"/></radialGradient><style>.s{font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}.gh{opacity:1;animation:gh 8s infinite}.so{opacity:0;animation:so 8s infinite}@keyframes gh{0%,48%{opacity:1}54%,94%{opacity:0}100%{opacity:1}}@keyframes so{0%,48%{opacity:0}54%,94%{opacity:1}100%{opacity:0}}.r2{animation-delay:.12s}.r3{animation-delay:.24s}.r4{animation-delay:.36s}.r5{animation-delay:.48s}.cur{animation:cur 8s infinite}@keyframes cur{0%{transform:translate(0,0);opacity:1}4%{transform:translate(0,0)}13%{transform:translate(0,42px)}22%{transform:translate(0,84px)}31%{transform:translate(0,126px)}40%{transform:translate(0,168px)}44%{opacity:1}50%,96%{opacity:0}100%{transform:translate(0,0);opacity:1}}.t{opacity:0;animation:tl 12s infinite}.t1{opacity:1}.t2{animation-delay:3s}.t3{animation-delay:6s}.t4{animation-delay:9s}@keyframes tl{0%{opacity:0}3%,22%{opacity:1}25%,100%{opacity:0}}@media (prefers-reduced-motion:reduce){.gh,.so,.cur,.t{animation:none}.t{opacity:0}.t1{opacity:1}.cur{opacity:0}}</style></defs><rect width="1200" height="360" rx="18" fill="#0B0D12"/><rect width="1200" height="360" rx="18" fill="url(#glow)"/><text x="60" y="138" class="s" font-size="84" font-weight="600" fill="#ECEFF6" text-anchor="start" letter-spacing="-2">OpenMind</text><text x="62" y="184" class="s" font-size="22" font-weight="400" fill="#9AA3B8" text-anchor="start" >The ambient intelligence layer for personal computing</text><rect x="60" y="208" width="150" height="32" rx="16" fill="none" stroke="#8B7BFF" stroke-width="1.5" /><text x="135.0" y="229" class="s" font-size="15" font-weight="500" fill="#8B7BFF" text-anchor="middle" >Mind understands</text><rect x="220" y="208" width="120" height="32" rx="16" fill="none" stroke="#ECEFF6" stroke-width="1.5" /><text x="280.0" y="229" class="s" font-size="15" font-weight="500" fill="#ECEFF6" text-anchor="middle" >Nexus shapes</text><rect x="350" y="208" width="105" height="32" rx="16" fill="none" stroke="#3B6CFF" stroke-width="1.5" /><text x="402.5" y="229" class="s" font-size="15" font-weight="500" fill="#3B6CFF" text-anchor="middle" >Pilot acts</text><rect x="465" y="208" width="128" height="32" rx="16" fill="none" stroke="#8FB4E8" stroke-width="1.5" stroke-dasharray="5 4"/><text x="529.0" y="229" class="s" font-size="15" font-weight="500" fill="#8FB4E8" text-anchor="middle" >Mirror proves</text><text x="62" y="296" class="s t t1" font-size="19" font-weight="400" fill="#ECEFF6" text-anchor="start" >Your computer, finally thinking with you.</text><text x="62" y="296" class="s t t2" font-size="19" font-weight="400" fill="#8FB4E8" text-anchor="start" >Rehearse in the mirror. Commit to reality.</text><text x="62" y="296" class="s t t3" font-size="19" font-weight="400" fill="#ECEFF6" text-anchor="start" >Autonomy will be commoditised. Trust will not.</text><text x="62" y="296" class="s t t4" font-size="19" font-weight="400" fill="#ECEFF6" text-anchor="start" >Mind understands. Nexus shapes. Pilot acts. Mirror proves.</text><rect class="gh" x="700" y="48" width="460" height="272" rx="18" fill="#12151C" stroke="#8FB4E8" stroke-width="1.5" stroke-dasharray="7 6"/><rect class="so" x="700" y="48" width="460" height="272" rx="18" fill="#12151C" stroke="#2FBF9B" stroke-width="1.5"/><g class="gh"><text x="728" y="86" class="s" font-size="15" font-weight="600" fill="#8FB4E8" text-anchor="start" >Mirror: rehearsing</text><text x="1132" y="86"