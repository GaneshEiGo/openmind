<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="The Rehearsal Loop: understand, compose, rehearse, approve, commit, verify, remember"><title>The Rehearsal Loop: understand, compose, rehearse, approve, commit, verify, remember</title><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#9AA3B8"/></marker><style>.s{font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}.p{opacity:0;animation:pl 7s infinite}@keyframes pl{0%{opacity:0}2%,12%{opacity:1}15%,100%{opacity:0}}@media (prefers-reduced-motion:reduce){.p{animation:none;opacity:0}}</style></defs><rect width="1200" height="340" rx="18" fill="#0B0D12"/><path d="M1110 100 C1110 20 90 20 90 98" fill="none" stroke="#9AA3B8" stroke-width="1.5" stroke-dasharray="3 5" marker-end="url(#ah)"/><text x="600" y="78" class="s" font-size="13" font-weight="400" fill="#9AA3B8" text-anchor="middle" >what it learns feeds the next request</text><line x1="126" y1="140" x2="224" y2="140" stroke="#272C3A" stroke-width="2" /><line x1="296" y1="140" x2="394" y2="140" stroke="#272C3A" stroke-width="2" /><line x1="466" y1="140" x2="564" y2="140" stroke="#8FB4E8" stroke-width="2" stroke-dasharray="5 5"/><line x1="636" y1="140" x2="734" y2="140" stroke="#272C3A" stroke-width="2" /><line x1="806" y1="140" x2="904" y2="140" stroke="#272C3A" stroke-width="2" /><line x1="976" y1="140" x2="1074" y2="140" stroke="#272C3A" stroke-width="2" /><circle class="p" style="animation-delay:0s" cx="90" cy="140" r="43" fill="none" stroke="#9AA3B8" stroke-width="2"/><circle cx="90" cy="140" r="34" fill="#12151C" stroke="#9AA3B8" stroke-width="2" /><text x="90" y="148" class="s" font-size="22" font-weight="600" fill="#9AA3B8" text-anchor="middle" >1</text><text x="90" y="220" class="s" font-size="17" font-weight="600" fill="#ECEFF6" text-anchor="middle" >Understand</text><text x="90" y="244" class="s" font-size="13" font-weight="400" fill="#9AA3B8" text-anchor="middle" >Intent Thread</text><circle class="p" style="animation-delay:1s" cx="260" cy="140" r="43" fill="none" stroke="#9AA3B8" stroke-width="2"/><circle cx="260" cy="140" r="34" fill="#12151C" stroke="#9AA3B8" stroke-width="2" /><text x="260" y="148" class="s" font-size="22" font-weight="600" fill="#9AA3B8" text-anchor="middle" >2</text><text x="260" y="220" class="s" font-size="17" font-weight="600" fill="#ECEFF6" text-anchor="middle" >Compose</text><text x="260" y="244" class="s" font-size="13" font-weight="400" fill="#9AA3B8" text-anchor="middle" >Focused workspace</text><circle class="p" style="animation-delay:2s" cx="430" cy="140" r="43" fill="none" stroke="#8FB4E8" stroke-width="2"/><circle cx="430" cy="140" r="34" fill="#8FB4E8" fill-opacity=".10" stroke="#8FB4E8" stroke-width="2" stroke-dasharray="5 4"/><text x="430" y="148" class="s" font-size="22" font-weight="600" fill="#8FB4E8" text-anchor="middle" >3</text><text x="430" y="220" class="s" font-size="17" font-weight="600" fill="#ECEFF6" text-anchor="middle" >Rehearse</text><text x="430" y="244" class="s" font-size="13" font-weight="400" fill="#9AA3B8" text-anchor="middle" >Mirror Theatre</text><circle class="p" style="animation-delay:3s" cx="600" cy="140" r="43" fill="none" stroke="#F0A63A" stroke-width="2"/><circle cx="600" cy="140" r="34" fill="#12151C" stroke="#F0A63A" stroke-width="2" /><text x="600" y="148" class="s" font-size="22" font-weight="600" fill="#F0A63A" text-anchor="middle" >4</text><text x="600" y="220" class="s" font-size="17" font-weight="600" fill="#ECEFF6" text-anchor="middle" >Approve</text><text x="600" y="244" class="s" font-size="13" font-weight="400" fill="#9AA3B8" text-anchor="middle" >Reality Diff</text><circle class="p" style="animation-delay:4s" cx="770" cy="140" r="43" fill="none" stroke="#3B6CFF" stroke-width="2"/><circle cx="770" cy="140" r="34" fill="#12151C" stroke="#3B6CFF" stroke-width="2" /><text x="770" y="148" class="s" font-size="22" font-weight="600" fill="#3B6CFF" text-anchor="middle" >5</text><text x="770" y="220" class="s" font-size="17" font-weight="600" fill="#ECEFF6" text-anchor="middle" >Commit</text><text x="770" y="244" class="s" font-size="13" font-weight="400" fill="#9AA3B8" text-anchor="middle" >One journaled transaction</text><circle class="p" style="animation-delay:5s" cx="940" cy="140" r="43" fill="none" stroke="#2FBF9B" stroke-width="2"/><circle cx="940" cy="140" r="34" fill="#12151C" stroke="#2FBF9B" stroke-width="2" /><text x="940" y="148" class="s" font-size="22" font-weight="600" fill="#2FBF9B" text-anchor="middle" >6</text><text x="940" y="220" class="s" font-size="17" font-weight="600" fill="#ECEFF6" text-anchor="middle" >Verify</text><text x="940" y="244" class="s" font-size="13" font-weight="400" fill="#9AA3B8" text-anchor="middle" >Independent checker</text><circle class="p" style="animation-delay:6s" cx="1110" cy="140" r="43" fill="none" stroke="#2FBF9B" stroke-width="2"/><circle cx="1110" cy="140" r="34" fill="#12151C" stroke="#2FBF9B" stroke-width="2" /><text x="1110" y="148" class="s" font-size="22" font-weight="600" fill="#2FBF9B" text-anchor="middle" >7</text><text x="1110" y="220" class="s" font-size="17" font-weight="600" fill="#ECEFF6" text-anchor="middle" >Remember</text><text x="1110" y="244" class="s" font-size="13" font-weight="400" fill="#9AA3B8" text-anchor="middle" >Receipt and undo window</text><text x="600" y="298" class="s" font-size="16" font-weight="400" fill="#9AA3B8" text-anchor="middle" >Nothing real changes before step 5. Everything to its left is rehearsal or review.</text></svg>